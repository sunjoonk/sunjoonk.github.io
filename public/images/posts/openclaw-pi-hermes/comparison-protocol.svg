<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">기능 목록에서 실제 작업 비교로</title><desc id="desc">동일 모델과 유사한 권한으로 코드 수정, 새 세션 기억, 반복 작업을 비교하고 정확도, 개입, 비용, 설정 시간을 기록한다.</desc><rect width="1200" height="620" fill="#f6f8fc"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="56" y="66" font-size="32" fill="#0f172a" font-weight="700">기능 목록에서 실제 작업 비교로</text><text x="56" y="108" font-size="21" fill="#334155" font-weight="400">아래는 실험 제안이다. 아직 측정한 결과나 우열은 없다.</text><rect x="56" y="145" width="1088" height="75" rx="18" fill="#eaf0fb" stroke="#d7dee8"/><text x="82" y="191" font-size="25" fill="#254a85" font-weight="600">조건 맞추기   같은 모델 · 유사한 도구 권한 · 같은 입력과 성공 기준</text><rect x="56" y="258" width="352" height="145" rx="18" fill="#ffffff" stroke="#d7dee8"/><text x="80" y="309" font-size="26" fill="#0f172a" font-weight="700">01  코드 수정</text><text x="80" y="357" font-size="22" fill="#334155" font-weight="400">테스트 통과와 변경 범위</text><rect x="424" y="258" width="352" height="145" rx="18" fill="#ffffff" stroke="#d7dee8"/><text x="448" y="309" font-size="26" fill="#0f172a" font-weight="700">02  새 세션 회상</text><text x="448" y="357" font-size="22" fill="#334155" font-weight="400">선호·규칙의 유지와 수정</text><rect x="792" y="258" width="352" height="145" rx="18" fill="#ffffff" stroke="#d7dee8"/><text x="816" y="309" font-size="26" fill="#0f172a" font-weight="700">03  반복 절차 수행</text><text x="816" y="357" font-size="22" fill="#334155" font-weight="400">지침 재사용과 실패 복구</text><text x="576" y="446" font-size="30" fill="#64748b" font-weight="400">↓</text><rect x="56" y="469" width="1088" height="91" rx="18" fill="#ffffff" stroke="#d7dee8"/><text x="82" y="524" font-size="24" fill="#334155" font-weight="400">기록하기   결과 정확도 / 사용자 개입 횟수 / 토큰 비용 / 추가 설정 시간</text></g></svg>