<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AI 에이전트를 만드는 세 가지 방식</title><desc id="desc">Pi는 확장 가능한 코어, OpenClaw는 Gateway 기반 연결, Hermes는 기억과 스킬의 재사용을 강조합니다.</desc><rect width="1200" height="700" fill="#f4f8f2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="56" y="66" font-size="32" fill="#0f172a" font-weight="700">AI 에이전트를 만드는 세 가지 방식</text><text x="56" y="105" font-size="20" fill="#334155" font-weight="400">공식 문서를 바탕으로 정리한 설계의 강조점 · 성능 순위가 아님</text><rect x="56" y="150" width="352" height="420" rx="18" fill="#ffffff" stroke="#d6e0d1"/><text x="80" y="203" font-size="32" fill="#6d55b5" font-weight="700">Pi</text><text x="80" y="244" font-size="23" fill="#0f172a" font-weight="600">직접 구성하는 작업 환경</text><rect x="76" y="285" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="92" y="324" font-size="21" fill="#334155" font-weight="400">작은 에이전트 코어</text><text x="221" y="363" font-size="20" fill="#6d55b5" font-weight="400">↓</text><rect x="76" y="367" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="92" y="406" font-size="21" fill="#334155" font-weight="400">확장 · 스킬 · 템플릿</text><text x="221" y="445" font-size="20" fill="#6d55b5" font-weight="400">↓</text><rect x="76" y="449" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="92" y="488" font-size="21" fill="#334155" font-weight="400">터미널 · RPC · SDK</text><rect x="424" y="150" width="352" height="420" rx="18" fill="#ffffff" stroke="#d6e0d1"/><text x="448" y="203" font-size="32" fill="#b34c38" font-weight="700">OpenClaw</text><text x="448" y="244" font-size="23" fill="#0f172a" font-weight="600">연결하고 운영하는 환경</text><rect x="444" y="285" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="460" y="324" font-size="21" fill="#334155" font-weight="400">상시 실행 Gateway</text><text x="589" y="363" font-size="20" fill="#b34c38" font-weight="400">↓</text><rect x="444" y="367" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="460" y="406" font-size="21" fill="#334155" font-weight="400">메신저 · 클라이언트 · 기기</text><text x="589" y="445" font-size="20" fill="#b34c38" font-weight="400">↓</text><rect x="444" y="449" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="460" y="488" font-size="21" fill="#334155" font-weight="400">세션 · 도구 정책 · 운영</text><rect x="792" y="150" width="352" height="420" rx="18" fill="#ffffff" stroke="#d6e0d1"/><text x="816" y="203" font-size="32" fill="#137c75" font-weight="700">Hermes</text><text x="816" y="244" font-size="23" fill="#0f172a" font-weight="600">경험을 재사용하는 환경</text><rect x="812" y="285" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="828" y="324" font-size="21" fill="#334155" font-weight="400">작업 실행과 결과</text><text x="957" y="363" font-size="20" fill="#137c75" font-weight="400">↓</text><rect x="812" y="367" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="828" y="406" font-size="21" fill="#334155" font-weight="400">지속 기억 · 과거 세션 검색</text><text x="957" y="445" font-size="20" fill="#137c75" font-weight="400">↓</text><rect x="812" y="449" width="312" height="62" rx="18" fill="#f4f8f2" stroke="#d6e0d1"/><text x="828" y="488" font-size="21" fill="#334155" font-weight="400">스킬 생성 · 수정 · 재사용</text><text x="56" y="628" font-size="23" fill="#334155" font-weight="400">세 프로젝트 모두 도구 실행과 확장을 지원하며, 기능의 범위는 서로 겹칩니다.</text></g></svg>