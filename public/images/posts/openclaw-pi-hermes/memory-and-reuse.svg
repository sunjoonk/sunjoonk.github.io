<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">Hermes의 기억은 어떻게 다음 작업으로 이어질까요?</title><desc id="desc">현재 세션에서 기억과 스킬을 저장하고 새 세션에서 기억을 문맥에 포함하며 필요할 때 과거 대화와 스킬을 조회합니다.</desc><rect width="1200" height="740" fill="#f4f8f2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="56" y="66" font-size="32" fill="#0f172a" font-weight="700">Hermes의 기억은 어떻게 다음 작업으로 이어질까요?</text><text x="56" y="108" font-size="20" fill="#334155" font-weight="400">문서에 설명된 기본 흐름을 단순화한 개념도</text><rect x="56" y="146" width="1088" height="106" rx="18" fill="#e8f1e4" stroke="#d6e0d1"/><text x="82" y="190" font-size="25" fill="#11645f" font-weight="700">현재 세션</text><text x="82" y="228" font-size="24" fill="#334155" font-weight="400">작업을 수행하면서 다음에도 필요한 정보와 절차를 도구로 저장합니다.</text><text x="220" y="287" font-size="26" fill="#137c75" font-weight="400">↓</text><rect x="56" y="306" width="352" height="124" rx="18" fill="#ffffff" stroke="#d6e0d1"/><text x="80" y="354" font-size="26" fill="#0f172a" font-weight="700">지속 기억</text><text x="80" y="393" font-size="21" fill="#334155" font-weight="400">MEMORY.md / USER.md</text><text x="220" y="467" font-size="26" fill="#137c75" font-weight="400">↓</text><text x="588" y="287" font-size="26" fill="#137c75" font-weight="400">↓</text><rect x="424" y="306" width="352" height="124" rx="18" fill="#ffffff" stroke="#d6e0d1"/><text x="448" y="354" font-size="26" fill="#0f172a" font-weight="700">대화 기록</text><text x="448" y="393" font-size="21" fill="#334155" font-weight="400">과거 세션 검색</text><text x="588" y="467" font-size="26" fill="#137c75" font-weight="400">↓</text><text x="956" y="287" font-size="26" fill="#137c75" font-weight="400">↓</text><rect x="792" y="306" width="352" height="124" rx="18" fill="#ffffff" stroke="#d6e0d1"/><text x="816" y="354" font-size="26" fill="#0f172a" font-weight="700">스킬</text><text x="816" y="393" font-size="21" fill="#334155" font-weight="400">재사용할 작업 지침</text><text x="956" y="467" font-size="26" fill="#137c75" font-weight="400">↓</text><rect x="56" y="490" width="1088" height="116" rx="18" fill="#ffffff" stroke="#d6e0d1"/><text x="82" y="535" font-size="25" fill="#11645f" font-weight="700">새 세션 / 다음 작업</text><text x="82" y="576" font-size="24" fill="#334155" font-weight="400">시작할 때 기억을 읽고, 필요할 때 과거 대화와 스킬을 불러옵니다.</text><text x="56" y="659" font-size="22" fill="#334155" font-weight="400">저장된 정보를 다시 활용하는 구조입니다. 모델의 가중치를 재학습하는 것은 아닙니다.</text><text x="56" y="705" font-size="20" fill="#64748b" font-weight="400">기억이 실제로 저장됐는지, 새 세션에서도 활용되는지 확인해야 합니다.</text></g></svg>